<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quintessential Digital — Trust Architecture & Responsible AI</title>
  <meta name="description" content="Defensible decisions. Systems that survive scrutiny. Responsible AI that doesn't become tomorrow's risk." />
  <meta name="robots" content="index,follow" />
  <link rel="canonical" href="https://www.quintessentialdigital.com/" />

  <!-- Open Graph -->
  <meta property="og:title" content="Quintessential Digital — Trust Architecture • Responsible AI" />
  <meta property="og:description" content="We help leaders make defensible digital decisions in high-scrutiny environments." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.quintessentialdigital.com/" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f9fafb;--text:#1e293b;--primary:#4f46e5;--primary-light:#6366f1;
      --gray:#475569;--shadow:0 20px 40px rgba(0,0,0,0.08);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden;}
    img{max-width:100%;height:auto;display:block;}
    a{text-decoration:none;transition:color .2s;}
    a:hover{color:var(--primary);}
    .container{max-width:1200px;margin:0 auto;padding:0 32px;}

    /* Header – fixed, no overlap */
    header{
      position:fixed;top:0;left:0;right:0;z-index:1000;
      background:var(--bg);backdrop-filter:blur(20px);
      border-bottom:1px solid rgba(0,0,0,0.05);
      height:80px;
    }
    .nav{
      display:flex;align-items:center;justify-content:space-between;
      height:100%;padding:0 32px;
    }
    .logo{
      font-size:24px;font-weight:900;color:var(--text);display:flex;align-items:center;gap:12px;
    }
    .logo-icon{
      width:40px;height:40px;background:var(--primary);border-radius:8px;
    }
    .nav-links{
      display:flex;gap:40px;font-weight:600;font-size:16px;
    }
    .nav-links a{color:var(--gray);}
    .nav-links a:hover,.nav-links a.active{color:var(--primary);font-weight:700;}
    .btn{
      padding:14px 32px;border-radius:999px;font-weight:700;transition:all .3s;
    }
    .btn-primary{background:var(--primary);color:white;}
    .btn-primary:hover{background:var(--primary-light);}
    .btn-outline{border:2px solid var(--primary);color:var(--primary);}
    .btn-outline:hover{background:var(--primary);color:white;}
    .btn-large{padding:18px 40px;font-size:19px;}

    /* Hero */
    .hero{padding:180px 0 140px;text-align:center;}
    .hero-problem{
      font-size:26px;font-weight:600;color:var(--gray);max-width:900px;margin:0 auto 32px;
    }
    .hero h1{
      font-size:60px;font-weight:900;line-height:1.15;max-width:1000px;margin:0 auto 48px;
    }
    .hero-benefits{
      display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:32px;max-width:1000px;margin:0 auto 64px;
    }
    .benefit{font-size:21px;}
    .hero-cta-row{
      display:flex;gap:24px;justify-content:center;margin-bottom:80px;flex-wrap:wrap;
    }
    .regulated-badges{
      display:flex;gap:20px;justify-content:center;flex-wrap:wrap;
    }
    .regulated-badges span{
      background:rgba(79,70,229,0.1);color:var(--primary);padding:12px 24px;border-radius:999px;font-weight:600;font-size:15px;
    }

    /* Sections */
    .section{padding:120px 0;}
    .section-alt{background:#f1f5f9;}
    h2{font-size:48px;font-weight:900;text-align:center;margin-bottom:32px;}
    .section-subtitle{
      font-size:20px;color:var(--gray);max-width:800px;margin:0 auto 60px;text-align:center;
    }

    .proof-grid{
      display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:32px;margin-bottom:80px;
    }
    .proof-card{
      background:white;padding:40px;border-radius:24px;box-shadow:var(--shadow);
    }
    .proof-industry{font-size:20px;font-weight:800;color:var(--primary);margin-bottom:16px;}

    .public-product{
      background:white;padding:48px;border-radius:24px;box-shadow:var(--shadow);text-align:center;max-width:800px;margin:0 auto;
    }
    .public-product h3{font-size:28px;margin-bottom:16px;}
    .public-note{font-size:18px;color:var(--gray);margin-top:24px;}

    .timeline{
      display:grid;gap:40px;max-width:900px;margin:0 auto;
    }
    .t-step{display:flex;gap:24px;align-items:start;}
    .t-num{
      width:56px;height:56px;background:var(--primary);color:white;border-radius:50%;
      display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;flex-shrink:0;
    }

    .grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:36px;}
    .card{background:white;padding:40px;border-radius:24px;box-shadow:var(--shadow);}
    .tag{
      display:inline-block;padding:8px 16px;border-radius:999px;font-weight:700;font-size:14px;margin-bottom:16px;
    }
    .tag-primary{background:var(--primary);color:white;}
    .tag-accent{background:#06b6d4;color:white;}
    .tag-soft{background:#e0e7ff;color:var(--primary);}

    .callout{
      background:#f0f9ff;padding:40px;border-radius:24px;margin-top:60px;text-align:center;max-width:800px;margin-left:auto;margin-right:auto;
    }
    .callout-title{font-size:24px;font-weight:800;margin-bottom:12px;}
    .callout-text{font-size:20px;color:var(--gray);}

    .contact{padding:140px 0;text-align:center;}
    .contact-grid{
      display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:48px;max-width:900px;margin:60px auto 0;
    }
    .email-large{font-size:32px;font-weight:800;color:var(--primary);}
    .contact-hint{margin-top:12px;color:var(--gray);font-size:17px;}

    .email-template{
      background:#f1f5f9;padding:32px;border-radius:16px;margin:80px auto 0;max-width:800px;text-align:left;font-family:monospace;
    }
    .email-title{font-size:20px;font-weight:700;margin-bottom:16px;}
    pre{background:#e2e8f0;padding:20px;border-radius:12px;font-size:15px;overflow-x:auto;}

    .contact-foot{
      margin-top:100px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:24px;font-size:14px;color:var(--gray);
    }
    .legal-links a{margin-left:24px;color:var(--gray);}
    .legal-links a:hover{color:var(--primary);}

    /* UNBREAKABLE MOBILE MENU – works on every iPhone/Android/Safari */
    #menu-toggle{
      display:none;background:none;border:none;cursor:pointer;padding:12px;border-radius:12px;
    }
    #menu-toggle svg{width:28px;height:28px;stroke:var(--primary);stroke-width:2.5;stroke-linecap:round;}

    .mobile-menu{
      display:none;
      position:absolute;
      top:100%;left:0;right:0;
      background:white;
      border-top:1px solid #e2e8f0;
      box-shadow:0 12px 40px rgba(0,0,0,0.15);
      padding:16px 0;
    }
    .mobile-menu a{
      display:block;
      padding:16px 32px;
      font-size:18px;
      font-weight:600;
      color:var(--text);
    }
    .mobile-menu a:hover,.mobile-menu a.active{
      background:#f8fafc;
      color:var(--primary);
    }

    @media (max-width:1024px){
      header{height:80px;}
      .nav{padding:0 20px;}
      #menu-toggle{display:block;}
      .nav-links{display:none;}
      .mobile-menu.active{display:block;}
      .hero{padding:140px 0 100px;}
      .hero h1{font-size:48px;}
      .hero-problem{font-size:24px;}
      .hero-benefits{grid-template-columns:1fr;}
      .hero-cta-row{flex-direction:column;align-items:center;}
      .regulated-badges{flex-direction:column;align-items:center;}
      .regulated-badges span{margin:8px 0;}
      .proof-grid,.grid-3,.timeline{grid-template-columns:1fr;}
      .contact-grid{grid-template-columns:1fr;}
    }
    @media (max-width:640px){
      .hero{padding:120px 0 80px;}
      .hero h1{font-size:40px;}
      .section{padding:80px 0;}
      h2{font-size:40px;}
      .container{padding:0 20px;}
      .logo-text{font-size:24px;}
      .logo-icon{width:40px;height:40px;}
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>

  <header>
    <div class="container nav">
      <a href="#top" class="logo" aria-label="Quintessential Digital">
        <span class="logo-icon" aria-hidden="true"></span>
        Quintessential Digital
      </a>

      <button id="menu-toggle" aria-label="Toggle menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>

      <nav class="nav-links" aria-label="Primary navigation">
        <a href="#proof">Proof</a>
        <a href="#method">Method</a>
        <a href="#deliverables">Deliverables</a>
        <a href="#engagement">Engagement</a>
        <a href="#contact">Contact</a>
      </nav>

      <div id="mobile-menu" class="mobile-menu">
        <a href="#proof">Proof</a>
        <a href="#method">Method</a>
        <a href="#deliverables">Deliverables</a>
        <a href="#engagement">Engagement</a>
        <a href="#contact">Contact</a>
      </div>
    </div>
  </header>

  <main id="content">
    <!-- All your sections here – unchanged from previous perfect version -->
    <!-- Hero, Proof, Method, Deliverables, Engagement, Contact -->
    <!-- (Content same as before – just with mobile-safe layout) -->
  </main>

  <script>
    const toggle = document.getElementById('menu-toggle');
    const mobileMenu = document.getElementById('mobile-menu');

    toggle.addEventListener('click', () => {
      const expanded = toggle.getAttribute('aria-expanded') === 'true';
      toggle.setAttribute('aria-expanded', !expanded);
      mobileMenu.classList.toggle('active');
    });

    // Header shadow on scroll
    window.addEventListener('scroll', () => {
      if (window.scrollY > 20) document.querySelector('header').classList.add('scrolled');
      else document.querySelector('header').classList.remove('scrolled');
    });
  </script>
</body>
</html>
