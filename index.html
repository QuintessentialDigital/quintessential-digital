<script>
  // Decision tree logic
  const tree = document.querySelector("#decision-tree");
  if (tree) {
    const d2 = document.getElementById("d2");
    const d3 = document.getElementById("d3");
    const resultBox = document.getElementById("decisionResult");
    const resultTitle = document.getElementById("resultTitle");
    const resultSub = document.getElementById("resultSub");

    function show(el){ el && (el.hidden = false); }
    function hide(el){ el && (el.hidden = true); }

    const results = {
      brief: {
        title: "Recommended: Decision Brief Sprint (~10 days)",
        sub: "We turn ambiguity into a defensible recommendation, clear trade-offs, and an executive-ready decision trail with an execution plan."
      },
      blueprint: {
        title: "Recommended: Trust Architecture Blueprint (3–5 weeks)",
        sub: "We define the target design, guardrails, ownership, and assurance-ready artifacts so delivery scales safely."
      },
      aigov: {
        title: "Recommended: Responsible AI Governance Kit (2–4 weeks)",
        sub: "We establish use-case gating, controls, ownership, and evidence trails so AI remains explainable and safe to operate."
      }
    };

    tree.addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;

      const next = btn.getAttribute("data-next");
      const res = btn.getAttribute("data-result");

      // hide flow cards first (keeps it clean)
      if (next === "d2") { show(d2); hide(d3); hide(resultBox); }
      if (next === "d3") { show(d3); hide(d2); hide(resultBox); }

      if (res && results[res]) {
        hide(d2); hide(d3);
        resultTitle.textContent = results[res].title;
        resultSub.textContent = results[res].sub;
        show(resultBox);
      }
    });
  }
</script>
